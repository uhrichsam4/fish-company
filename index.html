<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Fish Company</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="./src/ui/styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <div id="ui-root"></div>
  </div>

  <div id="boot">
    <div class="boot-inner">
      <div class="boot-logo">
        <span class="boot-fish">🐟</span>
        <h1>FISH<span>COMPANY</span></h1>
        <p class="boot-tag">you are broke. the ocean is not.</p>
      </div>
      <div class="boot-bar"><div id="boot-fill"></div></div>
      <div id="boot-status">booting…</div>
      <div id="boot-error"></div>
    </div>
  </div>

  <div id="click-to-play" class="hidden">
    <div class="ctp-inner">
      <h2>CLICK TO PLAY</h2>
      <p>WASD move &nbsp;·&nbsp; Mouse look &nbsp;·&nbsp; E interact &nbsp;·&nbsp; Esc release cursor</p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
