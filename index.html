<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Fish Company</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="./src/ui/styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <div id="ui-root"></div>
  </div>

  <div id="boot">
    <div class="boot-inner">
      <div class="boot-logo">
        <span class="boot-fish">🐟</span>
        <h1>FISH<span>COMPANY</span></h1>
        <p class="boot-tag">you are broke. the ocean is not.</p>
      </div>
      <div class="boot-bar"><div id="boot-fill"></div></div>
      <div id="boot-status">booting…</div>
      <div id="boot-error"></div>
    </div>
  </div>

  <div id="click-to-play" class="hidden">
    <div class="ctp-inner">
      <div class="menu-card">
        <div class="menu-brand">
          <span class="menu-fish">🐟</span>
          <h1>FISH COMPANY</h1>
          <p class="menu-tag">Build a fishing empire from a sandbar and a broken boat.</p>
        </div>

        <div class="menu-actions">
          <button type="button" class="menu-btn primary" data-menu="play">
            <span class="mb-icon">▶</span>
            <span class="mb-text"><b>Play</b><i>Jump straight in</i></span>
          </button>
          <button type="button" class="menu-btn" data-menu="multiplayer" aria-expanded="false">
            <span class="mb-icon">👥</span>
            <span class="mb-text"><b>Multiplayer</b><i data-menu-mp-sub>Play with friends</i></span>
            <span class="mb-chev">›</span>
          </button>
          <button type="button" class="menu-btn" data-menu="settings">
            <span class="mb-icon">⚙</span>
            <span class="mb-text"><b>Settings</b><i>Graphics, audio, controls</i></span>
          </button>
        </div>

        <div class="menu-slot" data-menu-panel="multiplayer" hidden></div>

        <p class="menu-controls">
          <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move
          &nbsp;·&nbsp; Mouse look
          &nbsp;·&nbsp; <kbd>E</kbd> interact
          &nbsp;·&nbsp; <kbd>Esc</kbd> release cursor
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
