<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fish Company — Procedural Prop Preview</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a8d8ef; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #c { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; top: 10px; left: 10px; z-index: 10; color: #10242e;
    background: rgba(255,255,255,.82); border: 1px solid rgba(0,0,0,.15); border-radius: 8px;
    padding: 10px 12px; font-size: 12px; line-height: 1.5; max-width: 340px; backdrop-filter: blur(6px);
  }
  #hud b { font-size: 13px; }
  #hud button { font: inherit; padding: 3px 8px; margin: 4px 4px 0 0; border-radius: 5px; border: 1px solid #234; background: #fff; cursor: pointer; }
  #hud button:hover { background: #def; }
  #err { position: fixed; bottom: 0; left: 0; right: 0; max-height: 30%; overflow: auto; z-index: 20;
         background: #611; color: #fdd; font-size: 12px; padding: 8px; white-space: pre-wrap; display: none; }
  #list { max-height: 40vh; overflow: auto; margin-top: 6px; font-size: 11px; }
  #list div { display: flex; justify-content: space-between; gap: 10px; }
  #list div.over { color: #a00; font-weight: bold; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <b>Procedural Prop Preview</b><br />
  <span id="stat">building…</span>
  <div>
    <button id="reroll">re-roll seed</button>
    <button id="wire">wireframe</button>
    <button id="flat">flat mat</button>
    <button id="top">top view</button>
    <button id="gnd">ground</button>
  </div>
  <div id="list"></div>
</div>
<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/examples/jsm/": "/node_modules/three/examples/jsm/",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { makeRNG } from '/src/util/math.js';
import {
  PROP_BUILDERS, PROP_NAMES, buildProp, makeSharedPropMaterial, mergePropToInstanced,
} from '/src/world/props/index.js';

const errBox = document.getElementById('err');
function showErr(msg) {
  errBox.style.display = 'block';
  errBox.textContent += msg + '\n';
}
window.addEventListener('error', (e) => showErr('ERROR: ' + (e.error?.stack || e.message)));
window.addEventListener('unhandledrejection', (e) => showErr('REJECTION: ' + (e.reason?.stack || e.reason)));

// ---------------------------------------------------------------- renderer
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa8d8ef);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 600);
camera.position.set(0, 22, 46);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 2, 6);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;

// ---------------------------------------------------------------- lighting
const hemi = new THREE.HemisphereLight(0xbfe8ff, 0xc9b489, 0.86);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3dd, 1.75);
sun.position.set(26, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const SH = 45;
sun.shadow.camera.left = -SH; sun.shadow.camera.right = SH;
sun.shadow.camera.top = SH; sun.shadow.camera.bottom = -SH;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 140;
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xbcd8ff, 0.32);
fill.position.set(-24, 16, -18);
scene.add(fill);

// A cheap sky/ground gradient environment so metal parts have something to
// reflect (a metallic material with no environment renders black).
{
  const cv = document.createElement('canvas');
  cv.width = 8; cv.height = 128;
  const g2 = cv.getContext('2d');
  const grad = g2.createLinearGradient(0, 0, 0, 128);
  grad.addColorStop(0.0, '#cfeaff');
  grad.addColorStop(0.48, '#a9d6ef');
  grad.addColorStop(0.52, '#c2b48f');
  grad.addColorStop(1.0, '#8d8265');
  g2.fillStyle = grad; g2.fillRect(0, 0, 8, 128);
  const envTex = new THREE.CanvasTexture(cv);
  envTex.mapping = THREE.EquirectangularReflectionMapping;
  envTex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(envTex).texture;
  scene.environmentIntensity = 0.55;
  envTex.dispose();
  pmrem.dispose();
}

// ---------------------------------------------------------------- ground
const groundMat = new THREE.MeshStandardMaterial({ color: 0xcfc199, roughness: 0.98, metalness: 0 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(600, 300, 0xb3a680, 0xc6bb9a);
grid.position.y = 0.005;
grid.material.opacity = 0.5;
grid.material.transparent = true;
scene.add(grid);

// ---------------------------------------------------------------- labels
function label(text, sub) {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 128;
  const g = cv.getContext('2d');
  g.clearRect(0, 0, 512, 128);
  g.fillStyle = 'rgba(20,32,40,0.82)';
  g.beginPath();
  const r = 22;
  g.roundRect(6, 14, 500, 96, r);
  g.fill();
  g.fillStyle = '#fff';
  g.font = 'bold 44px ui-monospace, Menlo, monospace';
  g.textAlign = 'center';
  g.fillText(text, 256, 62);
  g.fillStyle = '#9fe0c0';
  g.font = '30px ui-monospace, Menlo, monospace';
  g.fillText(sub, 256, 98);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sp.scale.set(3.2, 0.8, 1);
  sp.renderOrder = 999;
  return sp;
}

// ---------------------------------------------------------------- build
const sharedMat = makeSharedPropMaterial();
let root = null;
let swayers = [];
let spinners = [];
const listEl = document.getElementById('list');
const statEl = document.getElementById('stat');

// Unique geometry triangles (what the polycount budget is about) plus the
// drawn total once instancing is taken into account.
function triCountOf(o) {
  let unique = 0, drawn = 0, instances = 0;
  o.traverse((m) => {
    if (!m.geometry) return;
    const t = (m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count) / 3;
    const inst = m.isInstancedMesh ? m.count : 1;
    unique += t;
    drawn += t * inst;
    if (m.isInstancedMesh) instances += inst;
  });
  return { unique: Math.round(unique), drawn: Math.round(drawn), instances };
}

// options tuned so each prop shows off its variants inside a readable grid
const VARIANTS = [
  ['rock', { style: 'boulder', size: 1.1 }, 'boulder'],
  ['rock', { style: 'shard', size: 1.2, palette: 'volcanic' }, 'shard'],
  ['rock', { style: 'flat', size: 1.3, palette: 'warm' }, 'flat'],
  ['rock', { style: 'pillar', size: 1.3, palette: 'grey', moss: 0.45 }, 'pillar'],
  ['rockCluster', { size: 1.2, palette: 'grey' }],
  ['cliffChunk', { width: 5, height: 4.5, palette: 'warm' }],
  ['seaStack', { height: 8, palette: 'warm' }],
  ['iceberg', { size: 5 }],
  ['driftwood', { length: 2.6 }],
  ['shellsAndDebris', { spread: 1.6, count: 12 }],

  ['palmTree', { height: 6 }],
  ['palmTree', { height: 4.6, fronds: 8 }, 'small'],
  ['pineTree', { height: 6 }],
  ['pineTree', { height: 5, snow: 0.6 }, 'snowy'],
  ['bush', { size: 1.2, berries: true }],
  ['grassTuft', { height: 0.5 }],
  ['deadTree', { height: 5 }],
  ['kelp', { height: 4 }],
  ['coral', { size: 1.2, type: 'branch' }, 'branch'],
  ['coral', { size: 1.1, type: 'brain' }, 'brain'],
  ['coral', { size: 1.2, type: 'fan' }, 'fan'],
  ['cactus', { height: 2.6 }],
  ['fernPlant', { size: 1.2 }],

  ['dock', { length: 9, width: 2.6 }],
  ['shack', { roof: 'thatch' }, 'thatch'],
  ['shack', { roof: 'corrugated' }, 'corrugated'],
  ['campfire', {}],
  ['crate', { size: 0.8 }],
  ['barrel', {}],
  ['fishCrate', {}],
  ['sellStation', {}],
  ['signpost', { arrows: 3 }],
  ['lampPost', {}],
  ['buoy', {}],
  ['wreckedBoat', {}],
  ['warehouse', {}],
  ['pier', { length: 18 }],
  ['crane', { height: 9, reach: 8 }],
  ['tent', {}],
  ['ropeCoil', {}],
  ['fishingRodProp', {}],
  ['antenna', { height: 7 }],
  ['container', {}],
];

const ONLY = new URLSearchParams(location.search).get('only');
const BUDGET = { small: 400, tree: 900, building: 2500 };
const CLASS = {
  palmTree: 'tree', pineTree: 'tree', deadTree: 'tree', cactus: 'tree', fernPlant: 'tree',
  dock: 'building', shack: 'building', sellStation: 'building', warehouse: 'building',
  pier: 'building', crane: 'building', container: 'building', wreckedBoat: 'building',
};

function build(seed) {
  if (root) {
    root.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
    scene.remove(root);
  }
  root = new THREE.Group();
  swayers = []; spinners = [];
  listEl.innerHTML = '';
  const rng = makeRNG(seed);

  const items = [];
  const wanted = ONLY ? ONLY.split(',').map((s) => s.trim().toLowerCase()) : null;
  for (const [name, opts, tag] of VARIANTS) {
    if (wanted && !wanted.includes(name.toLowerCase())) continue;
    let obj, tris;
    try {
      const built = buildProp(name, rng, { ...opts, material: sharedMat });
      if (built.isObject3D) obj = built;
      else if (built.group) obj = built.group;               // shellsAndDebris
      else if (built.attributes) {                            // grassTuft geometry
        obj = new THREE.Group();
        const n = 14;
        const im = new THREE.InstancedMesh(built, sharedMat, n);
        const m = new THREE.Matrix4();
        for (let i = 0; i < n; i++) {
          const a = rng() * Math.PI * 2, r = Math.sqrt(rng()) * 0.75;
          m.compose(
            new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r),
            new THREE.Quaternion().setFromEuler(new THREE.Euler(0, rng() * 6.28, 0)),
            new THREE.Vector3(1, 1, 1).multiplyScalar(0.7 + rng() * 0.6),
          );
          im.setMatrixAt(i, m);
        }
        im.instanceMatrix.needsUpdate = true;
        im.castShadow = true; im.receiveShadow = true;
        obj.add(im);
        obj.userData.bounds = { radius: 1.0, height: 0.6 };
      } else throw new Error('builder returned something unexpected');
      tris = triCountOf(obj);
    } catch (e) {
      showErr(`build "${name}" failed: ${e.stack || e}`);
      continue;
    }
    if (obj.userData.sway) swayers.push(obj.userData.sway);
    if (obj.userData.armPivot) spinners.push(obj.userData.armPivot);
    // NaN / degenerate audit
    let bad = 0;
    obj.traverse((m) => {
      if (!m.geometry) return;
      const a = m.geometry.attributes.position.array;
      for (let i = 0; i < a.length; i++) if (!Number.isFinite(a[i])) { bad++; break; }
    });
    if (bad) showErr(`NaN vertices in ${name}`);
    items.push({ name, tag, obj, tris: tris.unique, drawn: tris.drawn, instances: tris.instances, r: Math.max(0.6, obj.userData.bounds?.radius ?? 1) });
  }

  // row-pack the grid: keep the overall footprint roughly 1.6:1
  const PAD = 2.0;
  let area = 0, sumW = 0;
  for (const it of items) { const w = it.r * 2 + PAD; sumW += w; area += w * w; }
  const MAXW = Math.max(10, Math.min(60, Math.sqrt(area * 1.7)));
  let x = 0, z = 0, rowDepth = 0, total = 0;
  for (const it of items) {
    const w = it.r * 2 + PAD;
    if (x + w > MAXW && x > 0) { z += rowDepth + PAD; x = 0; rowDepth = 0; }
    it.obj.position.x += x + w / 2 - MAXW / 2;
    it.obj.position.z += z + it.r;
    root.add(it.obj);
    const lbl = label(it.name + (it.tag ? ' · ' + it.tag : ''), it.instances ? `${it.tris} tris ×${it.instances}` : it.tris + ' tris');
    lbl.position.set(x + w / 2 - MAXW / 2, -0.05, z + it.r + it.r + 0.7);
    lbl.scale.set(Math.min(4.2, Math.max(2.6, w * 0.6)), Math.min(1.05, Math.max(0.65, w * 0.15)), 1);
    root.add(lbl);
    x += w; rowDepth = Math.max(rowDepth, it.r * 2 + 1.6);
    total += it.drawn;

    const cls = CLASS[it.name] || 'small';
    const over = it.tris > BUDGET[cls];
    const row = document.createElement('div');
    row.className = over ? 'over' : '';
    row.innerHTML = `<span>${it.name}${it.tag ? ' · ' + it.tag : ''}</span><span>${it.tris}${it.instances ? '×' + it.instances : ''}${over ? ' !' : ''}</span>`;
    listEl.appendChild(row);
  }
  scene.add(root);
  // frame everything
  root.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(root);
  const ctr = bb.getCenter(new THREE.Vector3());
  const size = bb.getSize(new THREE.Vector3());
  const span = Math.max(size.x, size.z, size.y * 1.6);
  controls.target.copy(ctr).setY(Math.max(0.8, size.y * 0.3));
  const vfov = (camera.fov * Math.PI) / 180;
  const hfov = 2 * Math.atan(Math.tan(vfov / 2) * Math.max(0.5, camera.aspect));
  const distH = (size.x * 0.55) / Math.tan(hfov / 2);
  const distV = (Math.max(size.z * 0.78, size.y * 1.15) * 0.55) / Math.tan(vfov / 2);
  const dist = Math.max(distH, distV, 6) * 1.04;
  camera.position.set(ctr.x + dist * 0.06, controls.target.y + dist * 0.52, ctr.z + dist * 0.85);
  camera.far = Math.max(600, dist * 4);
  camera.updateProjectionMatrix();
  controls.update();
  const SHX = Math.max(20, span * 0.62);
  sun.shadow.camera.left = -SHX; sun.shadow.camera.right = SHX;
  sun.shadow.camera.top = SHX; sun.shadow.camera.bottom = -SHX;
  sun.position.set(ctr.x + span * 0.5, span * 0.9, ctr.z + span * 0.4);
  sun.target.position.copy(ctr);
  sun.target.updateMatrixWorld();
  sun.shadow.camera.far = span * 3;
  sun.shadow.camera.updateProjectionMatrix();
  statEl.textContent = `${items.length} props · ${total} tris · seed ${seed}`;
  window.__preview = { root, items };
}

// focus the camera on one prop by name (used from the console / automation)
window.__focus = (name, dist = 0, elev = 0.42) => {
  const it = (window.__preview?.items || []).find((i) => i.name.toLowerCase() === String(name).toLowerCase());
  if (!it) return 'no such prop: ' + name;
  it.obj.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(it.obj);
  const c = bb.getCenter(new THREE.Vector3());
  const s = bb.getSize(new THREE.Vector3());
  const span = Math.max(s.x, s.y, s.z);
  const d = dist || span * 1.75;
  controls.target.copy(c);
  camera.position.set(c.x + d * Math.sin(elev) * 0.4, c.y + d * Math.sin(elev), c.z + d * Math.cos(elev));
  camera.updateProjectionMatrix();
  controls.update();
  return `${it.name} tris=${it.tris} size=${s.x.toFixed(2)}x${s.y.toFixed(2)}x${s.z.toFixed(2)}`;
};
window.__orbit = (az = 0, elev = 0.42) => {
  const c = controls.target.clone();
  const d = camera.position.distanceTo(c);
  camera.position.set(c.x + d * Math.cos(elev) * Math.sin(az), c.y + d * Math.sin(elev), c.z + d * Math.cos(elev) * Math.cos(az));
  controls.update();
  return 'ok';
};
window.__labels = (on) => { root.traverse((o) => { if (o.isSprite) o.visible = on; }); return 'ok'; };

let seed = 1337;
resize();
build(seed);

document.getElementById('reroll').onclick = () => { seed = (seed * 1664525 + 1013904223) >>> 0; errBox.textContent = ''; errBox.style.display = 'none'; build(seed); };
document.getElementById('wire').onclick = () => { sharedMat.wireframe = !sharedMat.wireframe; };
document.getElementById('flat').onclick = () => { sharedMat.flatShading = !sharedMat.flatShading; sharedMat.needsUpdate = true; };
document.getElementById('gnd').onclick = () => {
  ground.visible = !ground.visible; grid.visible = ground.visible;
};
document.getElementById('top').onclick = () => {
  camera.position.set(0, 60, controls.target.z + 0.01);
  controls.update();
};

// ---------------------------------------------------------------- loop

// `var` on purpose: resize() is called during setup, before this line runs.
var _lw = 0, _lh = 0, _lp = 0;
function resize() {
  const w = canvas.clientWidth || innerWidth;
  const h = canvas.clientHeight || innerHeight;
  const pr = Math.min(devicePixelRatio || 1, 2);
  if (w === _lw && h === _lh && pr === _lp) return;
  _lw = w; _lh = h; _lp = pr;
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
function tick() {
  const t = performance.now() / 1000;
  resize();
  for (const s of swayers) s(t);
  for (const p of spinners) p.rotation.y = Math.sin(t * 0.25) * 0.9;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
